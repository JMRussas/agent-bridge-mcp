[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge-mcp"
version = "0.1.0"
description = "MCP server that lets Claude agents on other machines talk to the agent on this one, and inspect the trees it works in"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp==1.26.0",
    "httpx==0.28.1",
    "anyio>=4.5",
    "uvicorn==0.52.3",
    "websockets==15.0.1",
    "regex>=2024.11",
]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"
agent-bridge-worker = "agent_bridge.worker:main"

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx2>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "core: source access, search, execution, logs, and mailbox primitives",
    "cli: configuration and operator commands",
    "http: REST and WebSocket behavior and authorization",
    "mcp: real MCP transport, identity, and responsiveness",
    "evidence: retained messages, sessions, links, and assignment outcomes",
    "leases: ownership conflicts, resolved paths, and worker claims",
    "reports: telemetry and evidence-backed learning reviews",
    "worker: subprocess supervision, recovery, and durable acknowledgment",
    "hygiene: tracked repository line-ending policy",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Warnings are errors, so a leaked handle or a bad escape fails the build
# instead of scrolling past. The exceptions are inside the MCP SDK and are
# not ours to fix: its settings model, and the anyio memory streams its
# streamable-HTTP server transport opens per request and never closes (seen
# by any test that completes a real MCP session; nothing in this package
# creates a memory stream).
filterwarnings = [
    "error",
    "ignore::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
    "ignore:Unclosed <MemoryObjectReceiveStream:ResourceWarning",
]
