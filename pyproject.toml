[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge-mcp"
version = "0.1.0"
description = "MCP server that lets Claude agents on other machines talk to the agent on this one, and inspect the trees it works in"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp==1.26.0",
    "anyio>=4.5",
    "httpx==0.28.1",
    "uvicorn==0.52.3",
    "websockets==15.0.1",
    "regex>=2024.11",
]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx2>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Warnings are errors, so a leaked handle or a bad escape fails the build
# instead of scrolling past. The one exception is inside the MCP SDK's own
# settings model and is not ours to fix.
filterwarnings = [
    "error",
    "ignore::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]
